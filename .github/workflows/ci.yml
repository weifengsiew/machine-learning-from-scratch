name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check algorithms demonstrations tests

      - name: Ruff format check
        run: ruff format --check algorithms demonstrations tests

      - name: Type check
        run: mypy demonstrations tests --ignore-missing-imports

      - name: Validate notebooks
        run: python -c "import json; json.load(open('demonstrations/parkinsons_demo.ipynb'))"

      - name: Run tests
        run: pytest -q
